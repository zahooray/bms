$kind: http-request
description: Django sets the csrftoken cookie on this GET. Django's CsrfViewMiddleware rejects the login POST without it.
url: "{{base_url}}/api/users/login/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const token = pm.cookies.get('csrftoken');
      pm.collectionVariables.set('csrftoken', token);
      pm.test('csrftoken cookie set', () => pm.expect(token).to.be.a('string'));
order: 1000
