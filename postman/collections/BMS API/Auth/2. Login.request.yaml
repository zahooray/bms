$kind: http-request
description: Form-encoded, not JSON - this is Django's AuthenticationForm, not a DRF endpoint.
url: "{{base_url}}/api/users/login/"
method: POST
headers:
  X-CSRFToken: "{{csrftoken}}"
body:
  type: urlencoded
  content:
    username: "{{username}}"
    password: "{{password}}"
    csrfmiddlewaretoken: "{{csrftoken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('redirects on success (302)', () => pm.expect([302, 200]).to.include(pm.response.code));
      pm.test('sessionid cookie set', () => pm.expect(pm.cookies.get('sessionid')).to.be.a('string'));
      // A FAILED login returns 200 with the HTML form, not an error.
      // Success is the 302 plus the sessionid cookie.
order: 2000
