$kind: http-request
description: Public (AllowAny). Paginated by PAGE_SIZE=12. branch_count comes from annotate(Count('branches')).
url: "{{base_url}}/api/banks/?page=1"
method: GET
queryParams:
  page: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('paginated envelope', () => pm.expect(body).to.have.all.keys('count','next','previous','results'));
order: 1000
