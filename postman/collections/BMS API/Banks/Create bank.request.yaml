$kind: http-request
description: swift_code is lower-case here on purpose - to_internal_value() upper-cases it before UniqueValidator runs.
url: "{{base_url}}/api/banks/"
method: POST
headers:
  Content-Type: application/json
  X-CSRFToken: "{{csrftoken}}"
body:
  type: text
  content: |-
    {
      "name": "Al Baraka Bank",
      "swift_code": "aiinpkka",
      "is_islamic": true,
      "established_date": "1991-06-12"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('bank_id', pm.response.json().id);
order: 2000
