$kind: http-request
description: validate_swift_code() rejects anything that is not 8 or 11 characters.
url: "{{base_url}}/api/banks/"
method: POST
headers:
  Content-Type: application/json
  X-CSRFToken: "{{csrftoken}}"
body:
  type: text
  content: |-
    {
      "name": "Bad Bank",
      "swift_code": "ABC",
      "established_date": "2000-01-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400', () => pm.response.to.have.status(400));
      pm.test('error on swift_code', () => pm.expect(pm.response.json()).to.have.property('swift_code'));
order: 3000
