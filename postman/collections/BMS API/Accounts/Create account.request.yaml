$kind: http-request
description: Set branch_id first (create a BankBranch in /admin/). Note there is no `user` field - perform_create() sets it from request.user, so ownership cannot be forged.
url: "{{base_url}}/api/accounts/"
method: POST
headers:
  Content-Type: application/json
  X-CSRFToken: "{{csrftoken}}"
body:
  type: text
  content: |-
    {
      "account_number": "PK0000000042",
      "bank_branch": {{branch_id}},
      "account_type": "savings",
      "balance": "5000.00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('account_id', pm.response.json().id);
order: 3000
