x-common: &common
  stdin_open: true
  tty: true
  restart: unless-stopped
  networks:
    - bms
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "3"

services:
  celery:
    build:
      context: .
      dockerfile: ./Dockerfile.prod
    container_name: bms-cc01
    restart: unless-stopped
    command: bash -c "celery -A bms worker -l info"
    depends_on:
      - django
      - redis
    env_file:
      - .env
    volumes:
      - .:/code/
      - project_name_media_volume:/code/media
    <<: *common

  celery-beat:
    build:
      context: .
      dockerfile: ./Dockerfile.prod
    container_name: bms-cb01
    restart: unless-stopped
    command: bash -c "celery -A bms worker -l info --beat --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    depends_on:
      - django
      - redis
    env_file:
      - .env
    volumes:
      - .:/code/
      - project_name_media_volume:/code/media
    <<: *common

  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    <<: *common

  django:
    build:
      context: .
      dockerfile: ./Dockerfile.prod
    container_name: bms-dc01
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/code
      - project_name_static_volume:/code/static
      - project_name_media_volume:/code/media
    depends_on:
      - redis
    <<: *common

  #  flower:
  #    image: mher/flower:0.9.7
  #    container_name: bms-fc01
  #    command: >
  #      flower
  #      --broker=redis://${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB:-0}
  #      --broker_api=redis://${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB:-0}
  #      --port=${FLOWER_PORT:-5555}
  #      --basic_auth=${FLOWER_USERNAME:-admin}:${FLOWER_PASSWORD:-admin}
  #    ports:
  #      - "${FLOWER_PORT:-5555}:5555"
  #    environment:
  #      - CELERY_BROKER_URL=redis://${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB:-0}
  #    depends_on:
  #      - celery
  #    <<: *common

  nginx:
    build:
      context: .
      dockerfile: ./config/nginx/Dockerfile
    container_name: bms-nc01
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/prod/default.conf:/etc/nginx/conf.d/default.conf
      - project_name_static_volume:/code/static
      - project_name_media_volume:/code/media
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - django
    #      - flower
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    <<: *common

  postgres:
    image: postgres:18-alpine
    container_name: bms-pc01
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - project_name_postgres_data:/var/lib/postgresql/data/
    <<: *common

  redis:
    image: redis:6.2-buster
    container_name: bms-rc01
    restart: unless-stopped
    volumes:
      - project_name_redis_data:/data
    <<: *common

networks:
  bms:
    driver: bridge

volumes:
  project_name_postgres_data:
  project_name_redis_data:
  project_name_static_volume:
  project_name_media_volume:
